<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- The JS favicon: black letterforms, coral (the nameplate's) when the browser is in dark mode.
       The letter shapes are a mask made from img/favicon_lg-03.jpg; change the colors below. -->
  <style>
    .ink { fill: #1E1C1C; }
    @media (prefers-color-scheme: dark) { .ink { fill: #D47259; } }
  </style>
  <defs>
    <mask id="letters" maskUnits="userSpaceOnUse" x="0" y="0" width="192" height="192">
      <image width="192" height="192" href="data:image/png;base64,"/>
    </mask>
  </defs>
  <rect class="ink" width="192" height="192" mask="url(#letters)"/>
</svg>
