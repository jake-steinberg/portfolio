<svg class="fig-narrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 732" width="360" height="732" role="img"><title>Town-label size by zoom in Strib Outdoors and Strib Elex</title><desc>Two charts sharing a zoom axis from 5 to 14 and a label-size axis in pixels. Outdoors sizes town names in two tiers by population rank; the rank needed for the larger tier loosens as you zoom in. Elex sizes them by population, showing the smallest and the largest town at each zoom band, with the population each band requires. The numbers are in the table below.</desc><text x="2" y="12" font-family="&#x27;Bell Topo Sans&#x27;, Outfit, system-ui, sans-serif" font-size="12.5" letter-spacing="0.1em" fill="#22201C" text-anchor="start">OUTDOORS · BY POPULATION RANK</text><text x="2" y="32" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-size="14" fill="#48423A" text-anchor="start">One line for each group of population ranks that</text><text x="2" y="50" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-size="14" fill="#48423A" text-anchor="start">are sized alike. The numbers are ranks.</text><text x="2" y="74" font-family="&#x27;Bell Topo Sans&#x27;, Outfit, system-ui, sans-serif" font-size="11.5" fill="#48423A" text-anchor="start">px</text><line x1="34" y1="260" x2="350" y2="260" stroke="#E6DECC"/><text x="26" y="264" font-family="&#x27;Bell Topo Sans&#x27;, Outfit, system-ui, sans-serif" font-size="11.5" letter-spacing="0.1em" fill="#48423A" text-anchor="end">8</text><line x1="34" y1="210.9" x2="350" y2="210.9" stroke="#E6DECC"/><text x="26" y="214.9" font-family="&#x27;Bell Topo Sans&#x27;, Outfit, system-ui, sans-serif" font-size="11.5" letter-spacing="0.1em" fill="#48423A" text-anchor="end">12</text><line x1="34" y1="161.7" x2="350" y2="161.7" stroke="#E6DECC"/><text x="26" y="165.7" font-family="&#x27;Bell Topo Sans&#x27;, Outfit, system-ui, sans-serif" font-size="11.5" letter-spacing="0.1em" fill="#48423A" text-anchor="end">16</text><line x1="34" y1