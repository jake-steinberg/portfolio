<svg class="fig-narrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" width="360" height="344" role="img"><title>Strib Elex layer stack around the election anchor</title><desc>Five bands, top to bottom: labels; the other layers above water; the water layer, which is the anchor; the slot where election layers are inserted, directly beneath water; and everything below, meant to resolve to one flat neutral.</desc><rect x="28" y="2" width="330" height="58" rx="3" fill="#FBF8F1" stroke="#8C8473" stroke-width="1"/><text x="42" y="26" font-family="&#x27;Bell Topo Sans&#x27;, Outfit, system-ui, sans-serif" font-size="12.5" letter-spacing="0.1em" fill="#22201C" text-anchor="start">LABELS</text><text x="42" y="46" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-size="14" fill="#22201C" text-anchor="start">12 visible label layers</text><rect x="28" y="68" width="330" height="76" rx="3" fill="#FBF8F1" stroke="#8C8473" stroke-width="1"/><text x="42" y="92" font-family="&#x27;Bell Topo Sans&#x27;, Outfit, system-ui, sans-serif" font-size="12.5" letter-spacing="0.1em" fill="#22201C" text-anchor="start">EVERYTHING ELSE ABOVE WATER</text><text x="42" y="112" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-size="14" fill="#22201C" text-anchor="start">46 visible layers: water, landuse, roads,</text><text x="42" y="130" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-size="14" fill="#22201C" text-anchor="start">boundaries</text><rect x="28" y="152" width="330" height="58" rx="3" fill="#949494" stroke="#8C8473" stroke-width="1"/><text x="42" y="176" font-family="&#x27;Bell Topo Sans&#x27;, Outfit, system-ui, sans-serif" font-size="12.5" letter-spacing="0.1em" fill="#22201C" text-anchor="start">WATER: THE ANCHOR</text><text x="42" y="196" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-size="14" fill="#22201C" text-anchor="start">layer &quot;water&quot;, #949494</text><rect x="28" y="218" width="330" height="58" rx="3" fill="none" stroke="#A34527" stroke-width="1.5" stroke-dasharray="5 3"/><line x1="4" y1="247" x2="17" y2="247" stroke="#A34527" stroke-width="1.25"/><path d="M22 247 L17 250 L17 244 Z" fill="#A34527"/><text x="42" y="242" font-family="&#x27;Bell Topo Sans&#x27;, Outfit, system-ui, sans-serif" font-size="12.5" letter-spacing="0.1em" fill="#A34527" text-anchor="start">ELECTION LAYERS INSERT HERE</text><text x="42" y="262" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-size="14" fill="#A34527" text-anchor="start">beforeId &quot;water&quot;</text><rect x="28" y="284" width="330" height="58" rx="3" fill="#FBF8F1" stroke="#8C8473" stroke-width="1"/><text x="42" y="308" font-family="&#x27;Bell Topo Sans&#x27;, Outfit, system-ui, sans-serif" font-size="12.5" letter-spacing="0.1em" fill="#22201C" text-anchor="start">EVERYTHING BELOW: ONE FLAT NEUTRAL</text><text x="42" y="328" font-family="&#x27;Source Serif 4&#x27;, Georgia, serif" font-size="14" fill="#22201C" text-anchor="start">the background; 26 land fills switched off</text></svg>
